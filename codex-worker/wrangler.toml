name = "codex-worker-relay"
main = "src/index.ts"
compatibility_date = "2026-08-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Relay egress is mandatory. The URL and key id are non-secret and live here so a
# deploy cannot silently lose them; EGRESS_RELAY_SECRET is a Worker secret and is
# deliberately absent — see ../docs/https-relay-design-v1.md.
[vars]
EGRESS_RELAY_URL = "https://relay.543822.xyz/v1/forward"
EGRESS_RELAY_KEY_ID = "w-20260820"

# Upstream allowlist, deliberately left EMPTY: every public HTTPS host is
# reachable. This is an explicit operator decision, not a dropped value -- the
# integration test asserts the binding is empty so it cannot be narrowed by
# accident, and cannot be emptied by accident either.
#
# What remains between this Worker and private-range egress is the relay's
# post-DNS SSRF policy, not this variable. Egress leaves the relay's VPS
# address, so abuse of the open path is attributed there.
#
# To re-narrow: list hosts comma-separated, a leading dot also matching
# subdomains (e.g. "ps.air-outer.com,.openai.com"). The enforcement code and its
# unit tests stay in place either way; only this value changes.
ALLOWED_UPSTREAM_HOSTS = ""
