# Claude ingress, deployed as its own Cloudflare Worker from its own package.
#
#   cd claude-worker && npx wrangler deploy
#
# Self-contained by design: this package carries its own relay envelope and
# signing code rather than importing the Codex package's, so either Worker can
# be built, deployed and rolled back on its own. Byte-identity with the Rust
# relay's conformance vectors is enforced by protocol/conformance.py, which
# drives both TypeScript implementations over the same vectors.
name = "claude-worker-relay"
main = "src/index.ts"
compatibility_date = "2026-08-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
# Same relay and same key id as the Codex Worker. The relay's KeyRing is keyed by
# id, so a shared key means zero relay-side change and no service restart. The
# tradeoff is that the relay cannot tell the two Workers apart, so neither can be
# revoked or rate-limited independently; splitting them later means adding a key
# to the relay's config and restarting it.
EGRESS_RELAY_URL = "https://relay.543822.xyz/v1/forward"
EGRESS_RELAY_KEY_ID = "w-20260820"

# Upstreams this Worker may reach. The ingress is open by design, so this is what
# keeps it from being an open proxy: egress leaves the relay's VPS address, and
# abuse would be attributed there. Anthropic-shaped hosts only -- there is no
# reason for a Claude ingress to reach an OpenAI endpoint.
#
# Costs callers nothing; it is not a client-side setting. A leading dot also
# matches subdomains. Clear the value to restore any-public-host behaviour.
ALLOWED_UPSTREAM_HOSTS = "ps.air-outer.com,.anthropic.com"

# EGRESS_RELAY_SECRET is deliberately absent: it is a Worker secret, set with
# `npx wrangler secret put EGRESS_RELAY_SECRET` from this directory, and it
# must be the SAME value the Codex Worker uses, since both sign against the
# relay's `w-20260820` key. See ../docs/https-relay-design-v1.md.
