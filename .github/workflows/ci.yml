name: ci

on:
  push:
    branches: [main]
  pull_request:

# Four independent jobs, deliberately not chained: `relay`, `codex-worker`
# and `claude-worker` must each stay buildable and testable on their own, so none
# gates the others. That independence is the point of the layout -- each is a
# separate deployment artifact with its own rollback.
#
# `conformance` is the only job that spans them, and it carries the two checks
# that exist because of the duplication that independence requires:
#
#   * shared_drift.py -- the 2054 lines both Worker packages carry byte-identical
#     really are identical, and every file is classified as shared, deliberately
#     divergent, or package-local.
#   * conformance.py -- the wire protocol, implemented four times (Rust, two
#     TypeScript Workers, Python probe), agrees over shared vectors, and each
#     subtree's copy of the fixture matches the canonical one.
jobs:
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  codex-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codex-worker/package-lock.json

      - run: npm ci
      # typecheck + vitest (workerd pool) + wrangler dry-run build.
      - run: npm run check

  claude-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claude-worker/package-lock.json

      - run: npm ci
      # typecheck + vitest (workerd pool) + wrangler dry-run build.
      - run: npm run check

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shared-code byte identity between the two Workers
        # The two packages carry 2054 lines of identical relay plumbing on
        # purpose, so each can deploy and roll back alone. conformance.py gates
        # 194 of those lines; this gates the rest, including src/pipeline.ts,
        # src/target.ts and src/redirect.ts, where a one-sided edit is a
        # one-sided security regression. Needs no toolchain of its own, so it
        # runs before the Rust and Node setup below and fails fast.
        run: python3 protocol/shared_drift.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            codex-worker/package-lock.json
            claude-worker/package-lock.json

      - name: Install codex-worker dependencies
        working-directory: codex-worker
        # esbuild is needed to bundle the TypeScript runner for plain Node.
        run: npm ci

      - name: Install claude-worker dependencies
        working-directory: claude-worker
        run: npm ci

      - name: Cross-language protocol conformance
        # Verifies the per-subtree fixture copies are byte-identical to
        # protocol/relay-protocol-v1.json, then drives all four implementations
        # over shared vectors covering ASCII header ordering, SPACE/TAB-only
        # whitespace folding, non-ASCII targets and empty header/body edge cases.
        # Any divergence in canonical form or HMAC fails -- including divergence
        # between the two Workers' own copies of the protocol code.
        run: python3 protocol/conformance.py
