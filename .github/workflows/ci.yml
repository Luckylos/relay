name: ci

on:
  push:
    branches: [main]
  pull_request:

# Four independent jobs, deliberately not chained: `egress-relay`, `codex-ingress`
# and `claude-ingress` must each stay buildable and testable on their own, so none
# gates the others. That independence is the point of the layout -- each is a
# separate deployment artifact with its own rollback.
#
# `conformance` is the only job that spans them, and it carries the two checks
# that exist because of the duplication that independence requires:
#
#   * shared_drift.py -- the files both Worker packages carry byte-identical
#     really are identical, and every file is classified as shared, deliberately
#     divergent, or package-local.
#   * conformance.py -- the wire protocol, implemented four times (Rust, two
#     TypeScript Workers, Python probe), agrees over shared vectors in every live
#     generation, and each subtree's copy of every fixture matches the canonical
#     one.
jobs:
  egress-relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: egress-relay
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: egress-relay

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  codex-ingress:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex-ingress
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codex-ingress/package-lock.json

      - run: npm ci
      # typecheck + vitest (workerd pool) + wrangler dry-run build.
      - run: npm run check

  claude-ingress:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-ingress
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claude-ingress/package-lock.json

      - run: npm ci
      # typecheck + vitest (workerd pool) + wrangler dry-run build.
      - run: npm run check

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shared-code byte identity between the two Workers
        # The two packages carry identical relay plumbing on purpose, so each can
        # deploy and roll back alone. conformance.py gates the wire protocol more
        # deeply; this gate covers the full declared shared surface, including
        # src/pipeline.ts, src/headers.ts, src/target.ts and src/redirect.ts,
        # where a one-sided edit is a one-sided security regression.
        # Needs no toolchain of its own, so it runs before the Rust and Node
        # setup below and fails fast.
        run: python3 protocol/shared_drift.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: egress-relay

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            codex-ingress/package-lock.json
            claude-ingress/package-lock.json

      - name: Install codex-ingress dependencies
        working-directory: codex-ingress
        # esbuild is needed to bundle the TypeScript runner for plain Node.
        run: npm ci

      - name: Install claude-ingress dependencies
        working-directory: claude-ingress
        run: npm ci

      - name: Cross-language protocol conformance
        # Verifies each subtree's fixture copies are byte-identical to the
        # canonical protocol/relay-protocol-v{1,2}.json, then drives all four
        # implementations over shared vectors covering ASCII header ordering,
        # SPACE/TAB-only whitespace folding, non-ASCII targets and empty
        # header/body edge cases. Every vector runs once per live generation, so
        # a runner that ignored a vector's version would pass v1 while never
        # signing a v2 byte. Any divergence in canonical form or HMAC fails --
        # including divergence between the two Workers' own copies.
        run: python3 protocol/conformance.py
